name: Validate public documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Markdown links, anchors, and formatting
        run: python tools/check_markdown.py

      - name: Check public Lua example syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.3
          find examples -type f -name '*.lua' -print0 | xargs -0 -r -n 1 luac5.3 -p
