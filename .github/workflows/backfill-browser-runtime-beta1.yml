name: Backfill beta.1 browser runtime mirror

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backfill-browser-runtime-beta1.yml"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download and verify runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="runtime/v0.9.0-beta.1"
          runtime_path="$runtime_dir/MiliUI-init.lua"
          mkdir -p "$runtime_dir"

          curl --fail --location --retry 3             "https://github.com/MyPingO/MiliUI/releases/download/v0.9.0-beta.1/MiliUI-init.lua"             --output "$runtime_path"

          echo "1b2032e4b49d837f0237c217ce51346a86abd98a242a513ee8d0713d75b9bf05  $runtime_path"             | sha256sum --check -

      - name: Add browser URL to manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          runtime = manifest.setdefault("runtime", {})
          runtime["browserUrl"] = (
              "https://raw.githubusercontent.com/MyPingO/MiliUI/main/"
              "runtime/v0.9.0-beta.1/MiliUI-init.lua"
          )
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit browser runtime mirror
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MiliUI Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.json runtime/v0.9.0-beta.1/MiliUI-init.lua

          if git diff --cached --quiet; then
            echo "Browser runtime mirror is already current."
            exit 0
          fi

          git commit -m "Publish beta.1 browser runtime mirror"
          git push
